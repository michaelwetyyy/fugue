[package]
name = "fugue"
version = "0.1.0"
description = "Cross-platform read-only cockpit for Fugue"
authors = ["Michael Wettasinghe"]
license = "MIT"
edition = "2021"

[lib]
name = "fugue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
dev-lab = ["dep:getrandom"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
getrandom = { version = "=0.3.4", optional = true }
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
socket2 = { version = "=0.6.5", features = [] }
tauri = { version = "=2.11.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
