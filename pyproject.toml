[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oc-rig"
version = "0.1.0.dev0"
description = "Fugue, a coordinated local OpenCode orchestration and review system"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Michael Wettasinghe" },
]
dependencies = []

[project.scripts]
rigctl = "oc_rig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oc_rig.store.migrations" = ["*.sql"]
"oc_rig.adapters" = ["rig-read-only-review.md"]
